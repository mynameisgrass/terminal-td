name: TerminalTD
options:
  bundleIdPrefix: com.mynameisgrass
  deploymentTarget:
    iOS: "15.0"
targets:
  TerminalTD:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mynameisgrass.terminaltd
        PRODUCT_NAME: TerminalTD
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
